paths:
  root: "/content/drive/MyDrive/Military_OD"
  raw_data: "/content/data/raw"
  processed_data: "/content/data/processed"
  experiments_data: "/content/data/experiments"
  outputs: "/content/drive/MyDrive/Military_OD/outputs_full"

kaggle:
  dataset: "rookieengg/military-aircraft-detection-dataset-yolo-format"

mode:
  smoke_test: false
  max_images_per_split: null
  max_classes: null

detector:
  model: "yolov8n.pt"
  imgsz: 640
  epochs: 50
  batch: -1
  workers: 2
  patience: 15
  seeds: [42, 43]

eval:
  split: "test"

planning:
  split: "val"

tail:
  method: "bottom_percent"
  bottom_percent: 0.3
  min_val_instances: 5

selective_generation:
  alpha: 0.6
  total_synthetic_budget: 1000
  min_per_class: 5
  max_per_class: 80

diffusion:
  model_id: "runwayml/stable-diffusion-inpainting"
  torch_dtype: "float16"
  num_inference_steps: 20
  guidance_scale: 7.5
  strength: 0.85
  resolution: 512
  mask_padding_ratio: 0.10
  mask_blur_radius: 12
  max_retries_per_image: 2
  bbox_diff_threshold: 18.0
  enable_attention_slicing: true
  enable_xformers_if_available: true
  prompts:
    - "realistic sky background, natural lighting, aviation photography, high resolution, realistic clouds"
    - "realistic runway background, military airbase, natural lighting, aviation photography"
    - "cloudy sky background, realistic atmosphere, aviation photography"
    - "clear blue sky, sunlight, realistic aircraft photography"
    - "desert airfield background, haze, realistic lighting"
  negative_prompt: "deformed aircraft, changed aircraft shape, extra aircraft, duplicate aircraft, new aircraft, distorted object, text, watermark, low quality, blurry"

experiments:
  variants:
    - real_only
    - basic_aug
    - tail_oversampling
    - uniform_tail_inpaint
    - selective_tail_inpaint
